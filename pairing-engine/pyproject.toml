[project]
name = "openswiss-pairing-engine"
version = "0.1.0"
description = "Deterministic calculation boundary for OpenSwiss pairings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

